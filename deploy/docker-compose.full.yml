# ─────────────────────────────────────────────────────────────
#  Full local stack: MongoDB + Ollama + Support-RAG API
#
#  Up:    docker compose -f deploy/docker-compose.full.yml up -d
#  Down:  docker compose -f deploy/docker-compose.full.yml down
#
#  Notes
#    - First run downloads Mistral (~4GB) into the ollama volume.
#    - The API depends on Mongo containing chunk_embeddings — build
#      it once from your host: `python -m src.vector_store.build_store`.
#      (We mount data/preprocessed into the api container; the build
#      script connects to the same Mongo this compose starts.)
# ─────────────────────────────────────────────────────────────

services:
  mongodb:
    image: mongo:7.0
    container_name: support_rag_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: support_rag
    volumes:
      - ../docker/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: support_rag_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Pull mistral on first run via a one-shot init container below.

  ollama_init:
    image: ollama/ollama:latest
    container_name: support_rag_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "ollama pull mistral && echo 'mistral ready'"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: support-rag-api:latest
    container_name: support_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-changeme}
      RAG_CONFIG: config/config.yaml
      DEFAULT_TOP_K: "5"
      CORS_ORIGINS: "*"
      LOG_LEVEL: INFO
      WORKERS: "1"
    depends_on:
      mongodb:
        condition: service_healthy
      ollama_init:
        condition: service_completed_successfully
    # Override config.yaml URIs at runtime so the API talks to the
    # sibling containers, not localhost.
    command: ["sh", "-c", "
      sed -i 's#mongodb://localhost:27017#mongodb://mongodb:27017#' config/config.yaml &&
      sed -i 's#http://localhost:11434#http://ollama:11434#' config/config.yaml &&
      gunicorn api.main:app
        --workers ${WORKERS:-1}
        --worker-class uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:8000
        --timeout 180
        --access-logfile -"]

volumes:
  ollama_models:
